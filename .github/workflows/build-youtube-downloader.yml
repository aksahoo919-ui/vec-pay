name: Build Easy Video Downloader (.exe)

on:
  push:
    paths:
      - "youtube-downloader/**"
      - ".github/workflows/build-youtube-downloader.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: youtube-downloader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller
      - name: Check the program loads on Windows
        run: python -c "import easy_video_downloader as m; print(m.APP_NAME, m.YTDLP_URL)"
      - name: Build
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name "Easy Video Downloader" --icon icon.ico --add-data "icon.ico;."
          easy_video_downloader.py
      - uses: actions/upload-artifact@v4
        with:
          name: Easy-Video-Downloader-Windows
          path: youtube-downloader/dist/Easy Video Downloader.exe
          if-no-files-found: error
